<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Inquiry Explorer</title>

		<style>
			:root {
				--primary: #1c85ba;
				--bg: #1c85ba;
				--text: #e2e8f0;
				--muted: #64748b;
				--white: #ffffff;
				--border: #e2e8f0;
			}
			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				height: 100vh;
				width: 100vw;
				background: var(--bg);
				color: var(--text);
				font-family: sans-serif;
			}

			.container {
				padding: 24px;
			}

			header {
				display: flex;
				align-items: center;
				gap: 14px;
				margin-bottom: 24px;
			}

			.logo {
				width: 48px;
				height: 48px;
				display: grid;
				place-items: center;
				border-radius: 12px;
				background: var(--primary);
				color: var(--white);
				font-size: 20px;
				font-weight: bold;
			}

			h1 {
				font-size: 18px;
				margin: 0;
			}

			.version {
				font-size: 11px;
				color: var(--text);
				margin-top: 5px;
			}

			.log-title {
				font-size: 11px;
				color: var(--text);
				font-weight: bold;
				margin-bottom: 10px;
			}

			.logs {
				height: 100px;
				overflow-y: auto;
				padding: 12px;
				background: var(--white);
				color: var(--muted);
				border-radius: 8px;
				font-family: monospace;
				font-size: 11px;
				line-height: 1.8;
				overflow-wrap: anywhere;
			}

			footer {
				display: flex;
				justify-content: space-between;
				margin-top: 16px;
				color: var(--text);
				font-size: 10px;
			}
		</style>
	</head>

	<body>
		<main class="container">
			<header>
				<div>
					<h1>Inquiry Explorer - Starting</h1>
				</div>
			</header>

			<div class="log-title">STARTUP LOG</div>

			<div id="logs" class="logs">
				<div>Initializing...</div>
			</div>

			<footer>
				<span>Inquiry Explorer (c) 2026- LingXuan-Li</span>
				<span>Starting...</span>
			</footer>
		</main>

		<script>
			window.addLog = function (message) {
				const logs = document.getElementById("logs");

				const line = document.createElement("div");
				line.textContent = message;

				logs.appendChild(line);

				while (logs.children.length > 5) {
					logs.removeChild(logs.firstChild);
				}

				logs.scrollTop = logs.scrollHeight;
			};
		</script>
	</body>
</html>
