<!doctype html>
<html lang="ja">
	<head>
		<base href="inquiry://templates/" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Inquiry Explorer</title>

		<style>
			:root {
				--primary: #1c85ba;
				--primary-dark: #156a94;
				--sidebar: #15668e;
				--bg: #f4f6f8;
				--surface: #ffffff;
				--text: #17222d;
				--muted: #5b6b7a;
				--subtle: #8a98a6;
				--border: #dfe5ea;
				--hover: #eef4f8;
				--ok: #1f8a5b;
				--warn: #d98a0b;
				--danger: #d64545;
				--danger-bg: #fdecec;
				--radius: 12px;
				--radius-sm: 8px;
			}

			@layer reset, page;

			@layer reset {
				* {
					margin: 0;
					padding: 0;
					box-sizing: border-box;
				}
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI",
					"Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
				font-size: 14px;
				line-height: 1.6;
				background: var(--bg);
				color: var(--text);
				-webkit-font-smoothing: antialiased;
			}

			/* Sidebar */
			.sidebar {
				position: fixed;
				top: 0;
				left: 0;
				width: 248px;
				height: 100vh;
				overflow-y: auto;
				overflow-x: hidden;
				-webkit-overflow-scrolling: touch;
				background: var(--sidebar);
				color: #fff;
				padding: 24px 14px;
				z-index: 1000;
				transition: transform 0.25s ease;
			}

			.logo {
				font-size: 18px;
				font-weight: 700;
				letter-spacing: 0.2px;
				padding: 4px 12px 28px;
			}

			.menu-title {
				font-size: 12px;
				font-weight: 600;
				color: rgba(255, 255, 255, 0.7);
				padding: 14px 12px 8px;
			}

			.nav a {
				position: relative;
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 10px 12px;
				margin-bottom: 2px;
				border-radius: var(--radius-sm);
				color: rgba(255, 255, 255, 0.92);
				font-size: 14px;
				font-weight: 500;
				text-decoration: none;
				transition: background 0.15s;
			}

			.nav a:hover {
				background: rgba(255, 255, 255, 0.1);
			}

			.nav a.active {
				background: rgba(255, 255, 255, 0.18);
				color: #fff;
				font-weight: 600;
			}

			.nav a.active::before {
				content: "";
				position: absolute;
				left: -14px;
				top: 8px;
				bottom: 8px;
				width: 3px;
				border-radius: 0 3px 3px 0;
				background: #fff;
			}

			.nav .icon {
				display: grid;
				place-items: center;
				width: 22px;
				height: 22px;
				flex: none;
			}

			.nav .icon svg {
				width: 20px;
				height: 20px;
				fill: none;
				stroke: currentColor;
				stroke-width: 1.8;
				stroke-linecap: round;
				stroke-linejoin: round;
			}

			.nav a:focus-visible,
			.toggle:focus-visible {
				outline: 3px solid #fff;
				outline-offset: 2px;
			}

			.toggle:focus-visible {
				outline-color: var(--primary);
			}

			/* Main */
			.main {
				margin-left: 248px;
				min-height: 100vh;
				padding: 20px 40px 40px;
			}

			.topbar {
				display: flex;
				align-items: center;
				min-height: 44px;
				margin-bottom: 8px;
			}

			.topbar h2 {
				font-size: 13px;
				font-weight: 600;
				color: var(--muted);
			}

			.toggle {
				display: none;
				width: 44px;
				height: 44px;
				border: none;
				border-radius: var(--radius-sm);
				background: none;
				color: var(--primary-dark);
				font-size: 24px;
				cursor: pointer;
			}

			.workspace {
				min-height: calc(100vh - 120px);
			}

			/* Overlay */
			.overlay {
				display: none;
			}

			/* Responsive */
			@media (max-width: 700px) {
				.sidebar {
					transform: translateX(-100%);
				}

				.sidebar.open {
					transform: translateX(0);
				}

				.main {
					margin-left: 0;
					padding: 12px 16px 32px;
				}

				.toggle {
					display: block;
				}

				.overlay.show {
					display: block;
					position: fixed;
					inset: 0;
					background: rgba(10, 25, 40, 0.5);
					z-index: 900;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.sidebar,
				.nav a {
					transition: none;
				}
			}
		</style>
	</head>

	<body>
		<!-- Sidebar -->
		<aside class="sidebar" id="sidebar">
			<div class="logo">Inquiry Explorer</div>

			<div class="menu-title">Main menu</div>

			<nav class="nav" aria-label="Main menu">
				<a href="#" class="active" data-page="home">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<path
								d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"
							/></svg
					></span>
					Dashboard
				</a>
				<a href="#" data-page="pc">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<rect x="3" y="4" width="18" height="12" rx="2" />
							<path d="M8 20h8M12 16v4" /></svg
					></span>
					PC Information
				</a>
				<a href="#" data-page="projects">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<rect x="3" y="3" width="7" height="7" rx="1.5" />
							<rect x="14" y="3" width="7" height="7" rx="1.5" />
							<rect x="3" y="14" width="7" height="7" rx="1.5" />
							<rect
								x="14"
								y="14"
								width="7"
								height="7"
								rx="1.5"
							/></svg
					></span>
					Projects
				</a>
				<a href="#" data-page="users">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<circle cx="9" cy="8" r="3.5" />
							<path
								d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.4c2 .8 3.5 2.8 3.5 5.6"
							/></svg
					></span>
					User Management
				</a>
			</nav>

			<div class="menu-title">System</div>

			<nav class="nav" aria-label="System">
				<a href="#" data-page="settings">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
							<circle cx="16" cy="7" r="2" />
							<circle cx="8" cy="17" r="2" /></svg
					></span>
					Settings
				</a>
				<a href="#" data-page="help">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<circle cx="12" cy="12" r="9" />
							<path
								d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"
							/></svg
					></span>
					Help
				</a>
				<a href="#" data-page="cloud-signup">
					<span class="icon" aria-hidden="true"
						><svg viewBox="0 0 24 24">
							<path
								d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9.5 4.25 4.25 0 0 1 17.5 18z"
							/></svg
					></span>
					Cloud Sign Up
				</a>
			</nav>
		</aside>

		<div class="overlay" id="overlay" onclick="closeMenu()"></div>

		<!-- Main -->
		<main class="main">
			<header class="topbar">
				<div style="display: flex; align-items: center; gap: 15px">
					<button
						class="toggle"
						onclick="toggleMenu()"
						aria-label="Open menu"
					>
						☰
					</button>

					<h2>Dashboard</h2>
				</div>
			</header>

			<!-- Empty content area -->
			<section class="workspace">
				<div id="content" class="page">Loading...</div>
			</section>
		</main>

		<script>
			const sidebar = document.getElementById("sidebar");
			const overlay = document.getElementById("overlay");
			const content = document.getElementById("content");

			// ========================================
			// Load CSS embedded in the target HTML.
			// ========================================

			async function executeStyles(doc, pageUrl) {
				// Remove previous page styles.
				document
					.querySelectorAll("[data-page-style]")
					.forEach((style) => {
						style.remove();
					});

				const styles = doc.querySelectorAll(
					'link[rel="stylesheet"], style',
				);

				for (const oldStyle of styles) {
					if (oldStyle.tagName === "LINK") {
						// External CSS.
						const cssUrl = new URL(
							oldStyle.getAttribute("href"),
							pageUrl,
						).href;

						const newStyle = document.createElement("style");

						newStyle.dataset.pageStyle = "true";

						if (oldStyle.media) {
							newStyle.media = oldStyle.media;
						}

						newStyle.textContent = `@import url("${cssUrl.replace(/"/g, '\\"')}") layer(page);`;

						await new Promise((resolve, reject) => {
							newStyle.onload = resolve;
							newStyle.onerror = () => {
								reject(
									new Error("Failed to load CSS: " + cssUrl),
								);
							};

							document.head.appendChild(newStyle);
						});
					} else {
						// Inline CSS.
						const newStyle = document.createElement("style");

						newStyle.dataset.pageStyle = "true";

						newStyle.textContent = `
        @layer page {
          ${oldStyle.textContent}
        }
      `;

						document.head.appendChild(newStyle);
					}
				}
			}
			// Track consecutive page navigation requests.
			let currentPageController = null;
			let navigationId = 0;

			// ========================================
			// Toggle the menu.
			// ========================================

			function toggleMenu() {
				sidebar.classList.toggle("open");
				overlay.classList.toggle("show");
				document
					.querySelector(".toggle")
					.setAttribute(
						"aria-expanded",
						sidebar.classList.contains("open"),
					);
			}

			function closeMenu() {
				sidebar.classList.remove("open");
				overlay.classList.remove("show");
				document
					.querySelector(".toggle")
					.setAttribute("aria-expanded", "false");
			}

			// ========================================
			// Execute JavaScript embedded in the HTML.
			// ========================================

			async function executeScripts(container, pageUrl) {
				const scripts = Array.from(
					container.querySelectorAll("script"),
				);

				for (const oldScript of scripts) {
					const newScript = document.createElement("script");

					// Copy the attributes.
					for (const attr of oldScript.attributes) {
						newScript.setAttribute(attr.name, attr.value);
					}

					// External JavaScript.
					if (oldScript.hasAttribute("src")) {
						const src = oldScript.getAttribute("src");

						newScript.src = new URL(src, pageUrl).href;

						// Preserve execution order unless async is specified.
						if (!oldScript.hasAttribute("async")) {
							newScript.async = false;
						}

						await new Promise((resolve, reject) => {
							newScript.onload = resolve;

							newScript.onerror = () => {
								reject(
									new Error(
										"Failed to load JavaScript: " +
											newScript.src,
									),
								);
							};

							oldScript.replaceWith(newScript);
						});
					} else {
						// JavaScript embedded directly in the HTML.
						const isModule =
							oldScript.getAttribute("type") === "module";

						if (isModule) {
							await new Promise((resolve, reject) => {
								newScript.onload = resolve;

								newScript.onerror = () => {
									reject(
										new Error(
											"Failed to execute JavaScript module",
										),
									);
								};

								newScript.textContent = oldScript.textContent;
								oldScript.replaceWith(newScript);
							});
						} else {
							newScript.textContent = oldScript.textContent;
							oldScript.replaceWith(newScript);
						}
					}
				}
			}

			// ========================================
			// Navigate between pages.
			// ========================================

			async function navigate(page, link) {
				if (!page) return;

				// Cancel the previous page load.
				if (currentPageController) {
					currentPageController.abort();
				}

				currentPageController = new AbortController();

				const controller = currentPageController;
				const thisNavigation = ++navigationId;

				try {
					// Build the page URL.
					const pageUrl = new URL(
						`pages/${page}.html`,
						document.baseURI,
					);

					// Fetch the HTML.
					const response = await fetch(pageUrl, {
						signal: controller.signal,
					});

					if (!response.ok) {
						throw new Error(
							"Failed to load page: " + response.status,
						);
					}

					const html = await response.text();

					// Ignore stale requests.
					if (thisNavigation !== navigationId) return;

					// Parse the HTML.
					const parser = new DOMParser();

					const doc = parser.parseFromString(html, "text/html");

					// Update the page title.
					const pageTitle =
						doc.querySelector("title")?.textContent ||
						"Inquiry Explorer";

					document.querySelector(".topbar h2").textContent =
						pageTitle;

					await executeStyles(doc, pageUrl);

					// Stop the previous page's timers/listeners.
					window.destroyStorageMonitor?.();
					window.destroyFolderMonitor?.();

					// Insert the page content.
					content.innerHTML = doc.body.innerHTML;

					// Execute the page scripts.
					await executeScripts(content, pageUrl);

					// Stop if a newer navigation has started.
					if (thisNavigation !== navigationId) return;

					// Dispatch the page-loaded event.
					content.dispatchEvent(
						new CustomEvent("page:loaded", {
							bubbles: true,
							detail: {
								page: page,
								title: pageTitle,
							},
						}),
					);

					// Update the active menu item.
					document.querySelectorAll(".nav a").forEach((item) => {
						item.classList.remove("active");
					});

					if (link) {
						link.classList.add("active");
					}

					// Close the menu on small screens.
					if (window.innerWidth <= 700) {
						closeMenu();
					}

					console.log("Page loaded:", page);
					console.log("Page URL:", pageUrl.href);
				} catch (error) {
					if (error.name === "AbortError") {
						return;
					}

					console.error("Page navigation error:", error);

					content.innerHTML = `
      <h2>Failed to load the page</h2>
      <p>${error.message}</p>
    `;
				}
			}

			// ========================================
			// Handle sidebar clicks.
			// ========================================

			document.querySelectorAll(".nav a").forEach((link) => {
				link.addEventListener("click", (event) => {
					event.preventDefault();

					const page = link.dataset.page;

					if (!page) {
						console.warn("Missing data-page attribute:", link);
						return;
					}

					navigate(page, link);
				});
			});

			// ========================================
			// Handle the page-loaded event.
			// ========================================

			document.addEventListener("keydown", (event) => {
				if (event.key === "Escape") closeMenu();
			});

			document.addEventListener("page:loaded", (event) => {
				console.log("Page initialized:", event.detail.page);
			});

			// ========================================
			// Load the initial page.
			// ========================================

			navigate("home", document.querySelector('[data-page="home"]'));

			// ========================================
			// Debug information.
			// ========================================

			console.log("href:", window.location.href);
			console.log("origin:", window.location.origin);
			console.log("protocol:", window.location.protocol);
			console.log("baseURI:", document.baseURI);
			console.log("app:", typeof window.app);
			console.log("app:", window.app);
			console.log("GetTemplatePage:", typeof window.app?.GetTemplatePage);
		</script>
	</body>
</html>
