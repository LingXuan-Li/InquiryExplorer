<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquiry Explorer</title>

    <style>
      :root {
        --primary: #1c85ba;
        --primary-dark: #176d99;
        --bg: #f5f7fa;
        --text: #1c1c1c;
        --muted: #64748b;
        --white: #ffffff;
        --border: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Sidebar */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        background: var(--primary);
        color: white;
        padding: 28px 18px;
        z-index: 1000;
        transition: 0.3s ease;
      }

      .logo {
        font-size: 23px;
        font-weight: 700;
        padding: 5px 12px 40px;
        letter-spacing: 0.3px;
      }

      .menu-title {
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
        opacity: 0.85;
        padding: 15px 12px 12px;
        letter-spacing: 1px;
      }

      .nav a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        margin-bottom: 7px;
        border-radius: 9px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        transition: 0.2s;
      }

      .nav a:hover,
      .nav a.active {
        background: rgba(0, 0, 0, 0.22);
        color: #ffffff;
      }

      .nav .icon {
        font-size: 20px;
        width: 23px;
        text-align: center;
      }

      .nav a:focus-visible,
      .toggle:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      /* Main */
      .main {
        margin-left: 250px;
        min-height: 100vh;
        padding: 28px 35px;
        transition: 0.3s;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 65px;
        padding: 0 25px;
      }

      .topbar h2 {
        font-size: 21px;
        font-weight: 700;
        color: var(--text);
      }

      .toggle {
        display: none;
        border: none;
        background: none;
        color: var(--primary);
        font-size: 26px;
        cursor: pointer;
      }

      /* Empty workspace */
      .workspace {
        min-height: calc(100vh - 140px);
        margin-top: 25px;
      }

      /* Overlay */
      .overlay {
        display: none;
      }

      /* Responsive */
      @media (max-width: 700px) {
        .sidebar {
          transform: translateX(-100%);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .main {
          margin-left: 0;
          padding: 15px;
        }

        .toggle {
          display: block;
        }

        .topbar {
          gap: 15px;
          padding: 0 18px;
        }

        .topbar h2 {
          font-size: 18px;
        }

        .overlay.show {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.45);
          z-index: 900;
        }

        .workspace {
          min-height: calc(100vh - 120px);
        }
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">Inquiry Explorer</div>

      <div class="menu-title">MAIN MENU</div>

      <nav class="nav">
        <a href="#" class="active" data-page="home">
          <span class="icon">⌂</span>
          ダッシュボード
        </a>

        <a href="#" data-page="reports">
          <span class="icon">▤</span>
          レポート
        </a>

        <a href="#" data-page="projects">
          <span class="icon">▣</span>
          プロジェクト
        </a>

        <a href="#" data-page="users">
          <span class="icon">♙</span>
          ユーザー管理
        </a>
      </nav>

      <div class="menu-title">SETTING</div>

      <nav class="nav">
        <a href="#" data-page="settings">
          <span class="icon">⚙</span>
          設定
        </a>

        <a href="#" data-page="help">
          <span class="icon">?</span>
          ヘルプ
        </a>
      </nav>

      <div class="menu-title">SETTING</div>

      <nav class="nav">
        <a href="#">
          <span class="icon">⚙</span>
          設定
        </a>

        <a href="#">
          <span class="icon">?</span>
          ヘルプ
        </a>
      </nav>
    </aside>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 15px">
          <button
            class="toggle"
            onclick="toggleMenu()"
            aria-label="メニューを開く"
          >
            ☰
          </button>

          <h2>ダッシュボード</h2>
        </div>
      </header>

      <!-- Empty content area -->
      <section class="workspace">
        <div id="content" class="page">Loading...</div>
      </section>
    </main>

    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const content = document.getElementById("content");

      // ページ切り替えの連続実行を管理
      let currentPageController = null;
      let navigationId = 0;

      // ========================================
      // メニュー開閉
      // ========================================

      function toggleMenu() {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
      }

      function closeMenu() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      }

      // ========================================
      // HTML内のJavaScriptを実行
      // ========================================

      async function executeScripts(container, pageUrl) {
        const scripts = Array.from(container.querySelectorAll("script"));

        for (const oldScript of scripts) {
          const newScript = document.createElement("script");

          // 属性を引き継ぐ
          for (const attr of oldScript.attributes) {
            newScript.setAttribute(attr.name, attr.value);
          }

          // 外部JavaScript
          if (oldScript.hasAttribute("src")) {
            const src = oldScript.getAttribute("src");

            newScript.src = new URL(src, pageUrl).href;

            // async指定がなければ順番を維持
            if (!oldScript.hasAttribute("async")) {
              newScript.async = false;
            }

            await new Promise((resolve, reject) => {
              newScript.onload = resolve;

              newScript.onerror = () => {
                reject(new Error("JavaScript読み込みエラー: " + newScript.src));
              };

              oldScript.replaceWith(newScript);
            });
          } else {
            // HTML内に直接記述されたJavaScript
            const isModule = oldScript.getAttribute("type") === "module";

            if (isModule) {
              await new Promise((resolve, reject) => {
                newScript.onload = resolve;

                newScript.onerror = () => {
                  reject(new Error("Module JavaScript実行エラー"));
                };

                newScript.textContent = oldScript.textContent;
                oldScript.replaceWith(newScript);
              });
            } else {
              newScript.textContent = oldScript.textContent;
              oldScript.replaceWith(newScript);
            }
          }
        }
      }

      // ========================================
      // ページ切り替え
      // ========================================

      async function navigate(page, link) {
        if (!page) return;

        // 古いページの読み込みをキャンセル
        if (currentPageController) {
          currentPageController.abort();
        }

        currentPageController = new AbortController();

        const controller = currentPageController;
        const thisNavigation = ++navigationId;

        try {
          // ページURL
          const pageUrl = new URL(`pages/${page}.html`, window.location.href);

          // HTML取得
          const response = await fetch(pageUrl, {
            signal: controller.signal,
          });

          if (!response.ok) {
            throw new Error("ページを読み込めませんでした: " + response.status);
          }

          const html = await response.text();

          // 古いリクエストなら処理を終了
          if (thisNavigation !== navigationId) return;

          // HTML解析
          const parser = new DOMParser();

          const doc = parser.parseFromString(html, "text/html");

          // ページタイトル更新
          const pageTitle =
            doc.querySelector("title")?.textContent || "Inquiry Explorer";

          document.querySelector(".topbar h2").textContent = pageTitle;

          // コンテンツ挿入
          content.innerHTML = doc.body.innerHTML;

          // JavaScript実行
          await executeScripts(content, pageUrl);

          // 古いページの処理を防止
          if (thisNavigation !== navigationId) return;

          // ページ読み込み完了イベント
          content.dispatchEvent(
            new CustomEvent("page:loaded", {
              bubbles: true,
              detail: {
                page: page,
                title: pageTitle,
              },
            }),
          );

          // アクティブメニュー更新
          document.querySelectorAll(".nav a").forEach((item) => {
            item.classList.remove("active");
          });

          if (link) {
            link.classList.add("active");
          }

          // スマートフォンならメニューを閉じる
          if (window.innerWidth <= 700) {
            closeMenu();
          }

          console.log("ページ読み込み完了:", page);
          console.log("ページURL:", pageUrl.href);
        } catch (error) {
          if (error.name === "AbortError") {
            return;
          }

          console.error("ページ切り替えエラー:", error);

          content.innerHTML = `
      <h2>ページの読み込みに失敗しました</h2>
      <p>${error.message}</p>
    `;
        }
      }

      // ========================================
      // サイドバーのクリックイベント
      // ========================================

      document.querySelectorAll(".nav a").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();

          const page = link.dataset.page;

          if (!page) {
            console.warn("data-pageが設定されていません:", link);
            return;
          }

          navigate(page, link);
        });
      });

      // ========================================
      // ページ切り替え完了イベント
      // ========================================

      document.addEventListener("page:loaded", (event) => {
        console.log("ページ初期化完了:", event.detail.page);
      });

      // ========================================
      // 初期ページ読み込み
      // ========================================

      navigate("home", document.querySelector('[data-page="home"]'));

      // ========================================
      // デバッグ情報
      // ========================================

      console.log("href:", window.location.href);
      console.log("origin:", window.location.origin);
      console.log("protocol:", window.location.protocol);
      console.log("baseURI:", document.baseURI);
      console.log("app:", typeof window.app);
      console.log("app:", window.app);
      console.log("GetTemplatePage:", typeof window.app?.GetTemplatePage);
    </script>
  </body>
</html>
