<!doctype html>
<html lang="ja">
  <head>
    <base href="app://templates/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquiry Explorer</title>

    <style>
      :root {
        --primary: #1c85ba;
        --primary-dark: #176d99;
        --bg: #f5f7fa;
        --text: #1c1c1c;
        --muted: #64748b;
        --white: #ffffff;
        --border: #e2e8f0;
      }

      @layer reset, page;

      @layer reset {
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* Sidebar */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        background: var(--primary);
        color: white;
        padding: 28px 18px;
        z-index: 1000;
        transition: 0.3s ease;
      }

      .logo {
        font-size: 23px;
        font-weight: 700;
        padding: 5px 12px 40px;
        letter-spacing: 0.3px;
      }

      .menu-title {
        font-size: 12px;
        font-weight: 700;
        color: #ffffff;
        opacity: 0.85;
        padding: 15px 12px 12px;
        letter-spacing: 1px;
      }

      .nav a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px;
        margin-bottom: 7px;
        border-radius: 9px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        text-decoration: none;
        transition: 0.2s;
      }

      .nav a:hover,
      .nav a.active {
        background: rgba(0, 0, 0, 0.22);
        color: #ffffff;
      }

      .nav .icon {
        font-size: 20px;
        width: 23px;
        text-align: center;
      }

      .nav a:focus-visible,
      .toggle:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      /* Main */
      .main {
        margin-left: 250px;
        min-height: 100vh;
        padding: 28px 35px;
        transition: 0.3s;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 65px;
        padding: 0 25px;
      }

      .topbar h2 {
        font-size: 21px;
        font-weight: 700;
        color: var(--text);
      }

      .toggle {
        display: none;
        border: none;
        background: none;
        color: var(--primary);
        font-size: 26px;
        cursor: pointer;
      }

      /* Empty workspace */
      .workspace {
        min-height: calc(100vh - 140px);
        margin-top: 25px;
      }

      /* Overlay */
      .overlay {
        display: none;
      }

      /* Responsive */
      @media (max-width: 700px) {
        .sidebar {
          transform: translateX(-100%);
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .main {
          margin-left: 0;
          padding: 15px;
        }

        .toggle {
          display: block;
        }

        .topbar {
          gap: 15px;
          padding: 0 18px;
        }

        .topbar h2 {
          font-size: 18px;
        }

        .overlay.show {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.45);
          z-index: 900;
        }

        .workspace {
          min-height: calc(100vh - 120px);
        }
      }
    </style>
  </head>

  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">Inquiry Explorer</div>

      <div class="menu-title">MAIN MENU</div>

      <nav class="nav">
        <a href="#" class="active" data-page="home">
          <span class="icon">⌂</span>
          Dashboard
        </a>

        <a href="#" data-page="reports">
          <span class="icon">▤</span>
          Reports
        </a>

        <a href="#" data-page="projects">
          <span class="icon">▣</span>
          Projects
        </a>

        <a href="#" data-page="users">
          <span class="icon">♙</span>
          User Management
        </a>
      </nav>

      <div class="menu-title">SETTING</div>

      <nav class="nav">
        <a href="#" data-page="settings">
          <span class="icon">⚙</span>
          Settings
        </a>

        <a href="#" data-page="help">
          <span class="icon">?</span>
          Help
        </a>
      </nav>
    </aside>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 15px">
          <button class="toggle" onclick="toggleMenu()" aria-label="Open menu">
            ☰
          </button>

          <h2>Dashboard</h2>
        </div>
      </header>

      <!-- Empty content area -->
      <section class="workspace">
        <div id="content" class="page">Loading...</div>
      </section>
    </main>

    <script>
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const content = document.getElementById("content");

      // ========================================
      // Load CSS embedded in the target HTML.
      // ========================================

      async function executeStyles(doc, pageUrl) {
        // Remove previous page styles.
        document.querySelectorAll("[data-page-style]").forEach((style) => {
          style.remove();
        });

        const styles = doc.querySelectorAll('link[rel="stylesheet"], style');

        for (const oldStyle of styles) {
          if (oldStyle.tagName === "LINK") {
            // External CSS.
            const cssUrl = new URL(oldStyle.getAttribute("href"), pageUrl).href;

            const newStyle = document.createElement("style");

            newStyle.dataset.pageStyle = "true";

            if (oldStyle.media) {
              newStyle.media = oldStyle.media;
            }

            newStyle.textContent = `@import url("${cssUrl.replace(/"/g, '\\"')}") layer(page);`;

            await new Promise((resolve, reject) => {
              newStyle.onload = resolve;
              newStyle.onerror = () => {
                reject(new Error("Failed to load CSS: " + cssUrl));
              };

              document.head.appendChild(newStyle);
            });
          } else {
            // Inline CSS.
            const newStyle = document.createElement("style");

            newStyle.dataset.pageStyle = "true";

            newStyle.textContent = `
        @layer page {
          ${oldStyle.textContent}
        }
      `;

            document.head.appendChild(newStyle);
          }
        }
      }
      // Track consecutive page navigation requests.
      let currentPageController = null;
      let navigationId = 0;

      // ========================================
      // Toggle the menu.
      // ========================================

      function toggleMenu() {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
      }

      function closeMenu() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
      }

      // ========================================
      // Execute JavaScript embedded in the HTML.
      // ========================================

      async function executeScripts(container, pageUrl) {
        const scripts = Array.from(container.querySelectorAll("script"));

        for (const oldScript of scripts) {
          const newScript = document.createElement("script");

          // Copy the attributes.
          for (const attr of oldScript.attributes) {
            newScript.setAttribute(attr.name, attr.value);
          }

          // External JavaScript.
          if (oldScript.hasAttribute("src")) {
            const src = oldScript.getAttribute("src");

            newScript.src = new URL(src, pageUrl).href;

            // Preserve execution order unless async is specified.
            if (!oldScript.hasAttribute("async")) {
              newScript.async = false;
            }

            await new Promise((resolve, reject) => {
              newScript.onload = resolve;

              newScript.onerror = () => {
                reject(
                  new Error("Failed to load JavaScript: " + newScript.src),
                );
              };

              oldScript.replaceWith(newScript);
            });
          } else {
            // JavaScript embedded directly in the HTML.
            const isModule = oldScript.getAttribute("type") === "module";

            if (isModule) {
              await new Promise((resolve, reject) => {
                newScript.onload = resolve;

                newScript.onerror = () => {
                  reject(new Error("Failed to execute JavaScript module"));
                };

                newScript.textContent = oldScript.textContent;
                oldScript.replaceWith(newScript);
              });
            } else {
              newScript.textContent = oldScript.textContent;
              oldScript.replaceWith(newScript);
            }
          }
        }
      }

      // ========================================
      // Navigate between pages.
      // ========================================

      async function navigate(page, link) {
        if (!page) return;

        // Cancel the previous page load.
        if (currentPageController) {
          currentPageController.abort();
        }

        currentPageController = new AbortController();

        const controller = currentPageController;
        const thisNavigation = ++navigationId;

        try {
          // Build the page URL.
          const pageUrl = new URL(`pages/${page}.html`, document.baseURI);

          // Fetch the HTML.
          const response = await fetch(pageUrl, {
            signal: controller.signal,
          });

          if (!response.ok) {
            throw new Error("Failed to load page: " + response.status);
          }

          const html = await response.text();

          // Ignore stale requests.
          if (thisNavigation !== navigationId) return;

          // Parse the HTML.
          const parser = new DOMParser();

          const doc = parser.parseFromString(html, "text/html");

          // Update the page title.
          const pageTitle =
            doc.querySelector("title")?.textContent || "Inquiry Explorer";

          document.querySelector(".topbar h2").textContent = pageTitle;

          await executeStyles(doc, pageUrl);

          // Insert the page content.
          content.innerHTML = doc.body.innerHTML;

          // Execute the page scripts.
          await executeScripts(content, pageUrl);

          // Stop if a newer navigation has started.
          if (thisNavigation !== navigationId) return;

          // Dispatch the page-loaded event.
          content.dispatchEvent(
            new CustomEvent("page:loaded", {
              bubbles: true,
              detail: {
                page: page,
                title: pageTitle,
              },
            }),
          );

          // Update the active menu item.
          document.querySelectorAll(".nav a").forEach((item) => {
            item.classList.remove("active");
          });

          if (link) {
            link.classList.add("active");
          }

          // Close the menu on small screens.
          if (window.innerWidth <= 700) {
            closeMenu();
          }

          console.log("Page loaded:", page);
          console.log("Page URL:", pageUrl.href);
        } catch (error) {
          if (error.name === "AbortError") {
            return;
          }

          console.error("Page navigation error:", error);

          content.innerHTML = `
      <h2>Failed to load the page</h2>
      <p>${error.message}</p>
    `;
        }
      }

      // ========================================
      // Handle sidebar clicks.
      // ========================================

      document.querySelectorAll(".nav a").forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();

          const page = link.dataset.page;

          if (!page) {
            console.warn("Missing data-page attribute:", link);
            return;
          }

          navigate(page, link);
        });
      });

      // ========================================
      // Handle the page-loaded event.
      // ========================================

      document.addEventListener("page:loaded", (event) => {
        console.log("Page initialized:", event.detail.page);
      });

      // ========================================
      // Load the initial page.
      // ========================================

      navigate("home", document.querySelector('[data-page="home"]'));

      // ========================================
      // Debug information.
      // ========================================

      console.log("href:", window.location.href);
      console.log("origin:", window.location.origin);
      console.log("protocol:", window.location.protocol);
      console.log("baseURI:", document.baseURI);
      console.log("app:", typeof window.app);
      console.log("app:", window.app);
      console.log("GetTemplatePage:", typeof window.app?.GetTemplatePage);
    </script>
  </body>
</html>
