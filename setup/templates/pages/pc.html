<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PC Information</title>

		<style>
			.container {
				max-width: 1080px;
				margin: 0 auto;
			}

			h1 {
				font-size: 24px;
				font-weight: 700;
				line-height: 1.3;
				margin-bottom: 4px;
			}

			.subtitle {
				max-width: 64ch;
				color: var(--muted);
				font-size: 14px;
				margin-bottom: 24px;
			}

			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 24px;
				margin-bottom: 16px;
			}

			h2 {
				font-size: 16px;
				font-weight: 650;
				margin-bottom: 18px;
			}

			.error {
				display: none;
				margin-bottom: 16px;
				padding: 12px 14px;
				border: 1px solid #f3b9b9;
				border-radius: var(--radius-sm);
				background: var(--danger-bg);
				color: #a52a2a;
				font-size: 14px;
				overflow-wrap: anywhere;
			}

			.empty {
				padding: 28px;
				color: var(--muted);
				text-align: center;
			}

			.refresh-info {
				margin-top: 14px;
				color: var(--muted);
				font-size: 12px;
				text-align: right;
			}

			/* ===== Folder tree ===== */
			.file-header,
			.file-item {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 90px 160px;
				align-items: center;
				gap: 12px;
				padding: 7px 10px;
			}

			.file-header {
				padding-top: 0;
				padding-bottom: 10px;
				margin-bottom: 6px;
				border-bottom: 1px solid var(--border);
				color: var(--muted);
				font-size: 12px;
				font-weight: 600;
			}

			.file-header span:nth-child(n + 2) {
				text-align: right;
			}

			.folder-title {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 7px 10px;
				border-radius: 6px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				user-select: none;
			}

			.folder-title:hover,
			.file-item:hover {
				background: var(--hover);
			}

			.folder-title:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}

			.folder-children {
				margin-left: 17px;
				padding-left: 8px;
				border-left: 1px solid var(--border);
			}

			.file-item {
				font-size: 13px;
				border-radius: 6px;
			}

			.file-name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.file-size,
			.file-date {
				color: var(--muted);
				font-size: 12px;
				font-variant-numeric: tabular-nums;
				text-align: right;
				white-space: nowrap;
			}

			@media (max-width: 700px) {
				.card {
					padding: 16px;
				}

				.file-item,
				.file-header {
					grid-template-columns: minmax(0, 1fr) 65px;
				}

				.file-date,
				.file-header span:nth-child(3) {
					display: none;
				}
			}

			/* ===== Tab View ===== */
			.tabview-navset {
				margin: 1em 0;
				font-size: 90%;
			}

			.tabview-nav {
				display: flex;
				flex-wrap: wrap;
				margin: 0;
				padding: 0;
				list-style: none;
				border-bottom: 5px solid var(--third-color);
				font-size: inherit;
				max-width: none;
			}

			.tabview-nav li {
				margin: 0 0.3em 0 0;
			}

			.tabview-nav a {
				display: block;
				padding: 0.4em 0.9em;
				cursor: pointer;
				background: var(--blockquote-code-color);
				color: var(--text-color);
				text-decoration: none;
				border: 1px solid var(--blockquote-code-border-color);
				border-bottom: 0;
				border-radius: 4px 4px 0 0;
			}

			.tabview-nav a:hover {
				background: var(--blockquote-code-border-color);
			}

			.tabview-nav li.selected a {
				background: var(--third-color);
				color: var(--background-color);
				font-weight: bold;
			}

			.tabview-content {
				padding: 1em;
				border: 1px solid var(--blockquote-code-border-color);
				border-top: 0;
				background: var(--background-color);
			}

			.tabview-content > div {
				display: none;
			}

			.tabview-content > div.active {
				display: block;
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>Desktop</h1>
			<p class="subtitle">
				Folders and files on your PC desktop. Select a folder to
				collapse or expand it.
			</p>

			<div id="error" class="error" role="alert"></div>
			<div class="tabview-navset">
				<ul class="tabview-nav" role="tablist">
					<li class="selected">
						<a href="#minimization">Minimization</a>
					</li>
					<li>
						<a href="#desktop">Desktop</a>
					</li>
					<li>
						<a href="#documents">Documents</a>
					</li>
					<li>
						<a href="#downloads">Downloads</a>
					</li>
				</ul>

				<div class="tabview-content">
					<div id="minimization" class="active">
						<h1>Minimization</h1>
					</div>
					<div id="desktop">
						<div id="file-tree"></div>
						<div id="lastUpdate" class="refresh-info"></div>
					</div>

					<div id="documents">Documents</div>

					<div id="downloads">Downloads</div>
				</div>
			</div>
		</div>

		<script>
			// ===== Tab switching =====
			function initTabs() {
				const tabs = document.querySelectorAll(".tabview-nav a");
				const contents = document.querySelectorAll(
					".tabview-content > div",
				);

				tabs.forEach((tab) => {
					tab.addEventListener("click", (event) => {
						event.preventDefault();

						const targetId = tab.getAttribute("href").substring(1);
						const target = document.getElementById(targetId);

						if (!target) return;

						// Deselect all tabs
						document
							.querySelectorAll(".tabview-nav li")
							.forEach((li) => li.classList.remove("selected"));

						// Hide all content
						contents.forEach((content) => {
							content.classList.remove("active");
						});

						// Display the selected tab and its content
						tab.parentElement.classList.add("selected");
						target.classList.add("active");
					});
				});
			}

			initTabs();

			(() => {
				"use strict";

				let isLoading = false;
				let isActive = false;
				let requestId = 0;

				function escapeHtml(value) {
					return String(value ?? "").replace(
						/[&<>"']/g,
						(char) =>
							({
								"&": "&amp;",
								"<": "&lt;",
								">": "&gt;",
								'"': "&quot;",
								"'": "&#039;",
							})[char],
					);
				}

				function showError(message) {
					const element = document.getElementById("error");
					if (!element) return;

					element.style.display = "block";
					element.textContent = message;
				}

				function hideError() {
					const element = document.getElementById("error");
					if (!element) return;

					element.style.display = "none";
					element.textContent = "";
				}

				// Render a file
				function renderFile(file) {
					const item = document.createElement("div");
					item.className = "file-item";

					const name = document.createElement("span");
					name.className = "file-name";
					name.textContent = "📄 " + file.name;
					name.title = file.path || file.name;

					const size = document.createElement("span");
					size.className = "file-size";
					size.textContent = file.readable_size || "";

					const date = document.createElement("span");
					date.className = "file-date";
					date.textContent = file.modTime || "";

					item.append(name, size, date);

					return item;
				}

				// Render a folder (recursive processing)
				function renderFolder(folder) {
					const container = document.createElement("div");
					container.className = "folder";

					const title = document.createElement("div");
					title.className = "folder-title";

					const icon = document.createElement("span");
					icon.className = "folder-icon";
					icon.textContent = "📁";

					const name = document.createElement("span");
					name.textContent = folder.name || "";
					name.title = folder.path || folder.name || "";

					title.append(icon, name);
					title.tabIndex = 0;
					title.setAttribute("role", "button");
					title.setAttribute("aria-expanded", "false");

					const children = document.createElement("div");
					children.className = "folder-children";
					children.style.display = "none";

					// Child folders
					(folder.folders || []).forEach((subFolder) => {
						children.appendChild(renderFolder(subFolder));
					});

					// Files
					(folder.files || []).forEach((file) => {
						children.appendChild(renderFile(file));
					});

					// Expand/collapse handling
					let expanded = false;

					const toggle = () => {
						expanded = !expanded;
						children.style.display = expanded ? "block" : "none";
						icon.textContent = expanded ? "📂" : "📁";
						title.setAttribute("aria-expanded", String(expanded));
					};

					title.addEventListener("click", toggle);
					title.addEventListener("keydown", (event) => {
						if (event.key === "Enter" || event.key === " ") {
							event.preventDefault();
							toggle();
						}
					});

					container.append(title, children);

					return container;
				}

				// Display the entire folder tree
				function updateFolderTree(data) {
					const container = document.getElementById("file-tree");
					if (!container) return;

					container.replaceChildren();

					if (!data) {
						container.textContent =
							"No folder information available.";
						return;
					}

					const header = document.createElement("div");
					header.className = "file-header";

					["Name", "Size", "Modified"].forEach((text) => {
						const span = document.createElement("span");
						span.textContent = text;
						header.appendChild(span);
					});

					container.appendChild(header);
					container.appendChild(renderFolder(data));
				}

				// Retrieve folder information from the Go API
				async function getFolderInfo() {
					if (!isActive || isLoading) return;

					isLoading = true;
					const currentRequest = ++requestId;

					try {
						if (typeof window.app_get_desktop_info !== "function") {
							throw new Error(
								"Glaze API app_get_desktop_info was not found",
							);
						}

						const folder = await window.app_get_desktop_info();

						if (!isActive || currentRequest !== requestId) return;

						if (!folder || typeof folder !== "object") {
							throw new Error(
								"Invalid folder information response",
							);
						}

						hideError();

						updateFolderTree(folder);

						// If the response came from cache, refresh once and apply the
						// latest scan directly to the active page.
						if (!folder.refreshed) {
							window.setTimeout(async () => {
								if (!isActive) return;
								try {
									const latest =
										await window.app_get_desktop_info(true);
									if (
										isActive &&
										latest &&
										typeof latest === "object"
									) {
										updateFolderTree(latest);
									}
								} catch (refreshError) {
									console.error(
										"Desktop refresh error:",
										refreshError,
									);
								}
							}, 0);
						}

						const lastUpdate =
							document.getElementById("lastUpdate");

						if (lastUpdate) {
							lastUpdate.textContent =
								"Last updated: " +
								new Date().toLocaleTimeString("en-US");
						}
					} catch (error) {
						console.error("Folder Error:", error);

						if (isActive && currentRequest === requestId) {
							showError(
								"Failed to get folder information: " +
									error.message,
							);
						}
					} finally {
						if (currentRequest === requestId) {
							isLoading = false;
						}
					}
				}

				window.initFolderMonitor = function () {
					if (isActive) return;

					isActive = true;
					getFolderInfo();
				};

				window.destroyFolderMonitor = function () {
					isActive = false;
					requestId++;
					isLoading = false;
				};

				window.initFolderMonitor();
			})();
		</script>
	</body>
</html>
