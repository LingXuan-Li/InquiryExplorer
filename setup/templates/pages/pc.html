<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PC Information</title>

		<style>
			.container {
				max-width: 1080px;
				margin: 0 auto;
			}

			h1 {
				font-size: 24px;
				font-weight: 700;
				line-height: 1.3;
				margin-bottom: 4px;
			}

			.subtitle {
				max-width: 64ch;
				color: var(--muted);
				font-size: 14px;
				margin-bottom: 24px;
			}

			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 24px;
				margin-bottom: 16px;
			}

			h2 {
				font-size: 16px;
				font-weight: 650;
				margin-bottom: 18px;
			}

			.error {
				display: none;
				margin-bottom: 16px;
				padding: 12px 14px;
				border: 1px solid #f3b9b9;
				border-radius: var(--radius-sm);
				background: var(--danger-bg);
				color: #a52a2a;
				font-size: 14px;
				overflow-wrap: anywhere;
			}

			.empty {
				padding: 28px;
				color: var(--muted);
				text-align: center;
			}

			.refresh-info {
				margin-top: 14px;
				color: var(--muted);
				font-size: 12px;
				text-align: right;
			}

			/* ===== Folder tree ===== */
			.file-header,
			.file-item {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 90px 160px;
				align-items: center;
				gap: 12px;
				padding: 7px 10px;
			}

			.file-header {
				padding-top: 0;
				padding-bottom: 10px;
				margin-bottom: 6px;
				border-bottom: 1px solid var(--border);
				color: var(--muted);
				font-size: 12px;
				font-weight: 600;
			}

			.file-header span:nth-child(n + 2) {
				text-align: right;
			}

			.folder-title {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 7px 10px;
				border-radius: 6px;
				font-size: 14px;
				font-weight: 600;
				cursor: pointer;
				user-select: none;
			}

			.folder-title:hover,
			.file-item:hover {
				background: var(--hover);
			}

			.folder-title:focus-visible {
				outline: 2px solid var(--primary);
				outline-offset: -2px;
			}

			.folder-children {
				margin-left: 17px;
				padding-left: 8px;
				border-left: 1px solid var(--border);
			}

			.file-item {
				font-size: 13px;
				border-radius: 6px;
			}

			.file-name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.file-size,
			.file-date {
				color: var(--muted);
				font-size: 12px;
				font-variant-numeric: tabular-nums;
				text-align: right;
				white-space: nowrap;
			}

			@media (max-width: 700px) {
				.card {
					padding: 16px;
				}

				.file-item,
				.file-header {
					grid-template-columns: minmax(0, 1fr) 65px;
				}

				.file-date,
				.file-header span:nth-child(3) {
					display: none;
				}
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>Desktop</h1>
			<p class="subtitle">
				Folders and files on your PC desktop. Select a folder to
				collapse or expand it.
			</p>

			<div id="error" class="error" role="alert"></div>

			<div class="card">
				<div id="file-tree"></div>
				<div id="lastUpdate" class="refresh-info"></div>
			</div>
		</div>

		<script>
			(() => {
				"use strict";

				let isLoading = false;
				let isActive = false;
				let requestId = 0;

				function escapeHtml(value) {
					return String(value ?? "").replace(
						/[&<>"']/g,
						(char) =>
							({
								"&": "&amp;",
								"<": "&lt;",
								">": "&gt;",
								'"': "&quot;",
								"'": "&#039;",
							})[char],
					);
				}

				function showError(message) {
					const element = document.getElementById("error");
					if (!element) return;

					element.style.display = "block";
					element.textContent = message;
				}

				function hideError() {
					const element = document.getElementById("error");
					if (!element) return;

					element.style.display = "none";
					element.textContent = "";
				}

				// ファイル表示
				function renderFile(file) {
					const item = document.createElement("div");
					item.className = "file-item";

					const name = document.createElement("span");
					name.className = "file-name";
					name.textContent = "📄 " + file.name;
					name.title = file.path || file.name;

					const size = document.createElement("span");
					size.className = "file-size";
					size.textContent = file.readable_size || "";

					const date = document.createElement("span");
					date.className = "file-date";
					date.textContent = file.modTime || "";

					item.append(name, size, date);

					return item;
				}

				// フォルダ表示（再帰処理）
				function renderFolder(folder) {
					const container = document.createElement("div");
					container.className = "folder";

					const title = document.createElement("div");
					title.className = "folder-title";

					const icon = document.createElement("span");
					icon.className = "folder-icon";
					icon.textContent = "📂";

					const name = document.createElement("span");
					name.textContent = folder.name || "";
					name.title = folder.path || folder.name || "";

					title.append(icon, name);
					title.tabIndex = 0;
					title.setAttribute("role", "button");
					title.setAttribute("aria-expanded", "true");

					const children = document.createElement("div");
					children.className = "folder-children";

					// 子フォルダ
					(folder.folders || []).forEach((subFolder) => {
						children.appendChild(renderFolder(subFolder));
					});

					// ファイル
					(folder.files || []).forEach((file) => {
						children.appendChild(renderFile(file));
					});

					// 開閉処理
					let expanded = true;

					const toggle = () => {
						expanded = !expanded;
						children.style.display = expanded ? "block" : "none";
						icon.textContent = expanded ? "📂" : "📁";
						title.setAttribute("aria-expanded", String(expanded));
					};

					title.addEventListener("click", toggle);
					title.addEventListener("keydown", (event) => {
						if (event.key === "Enter" || event.key === " ") {
							event.preventDefault();
							toggle();
						}
					});

					container.append(title, children);

					return container;
				}

				// ファイルツリー全体を表示
				function updateFolderTree(data) {
					const container = document.getElementById("file-tree");
					if (!container) return;

					container.replaceChildren();

					if (!data) {
						container.textContent =
							"No folder information available.";
						return;
					}

					const header = document.createElement("div");
					header.className = "file-header";

					["Name", "Size", "Modified"].forEach((text) => {
						const span = document.createElement("span");
						span.textContent = text;
						header.appendChild(span);
					});

					container.appendChild(header);
					container.appendChild(renderFolder(data));
				}

				// Go APIからフォルダ情報取得
				async function getFolderInfo() {
					if (!isActive || isLoading) return;

					isLoading = true;
					const currentRequest = ++requestId;

					try {
						if (typeof window.app_get_desktop_info !== "function") {
							throw new Error(
								"Glaze API app_get_desktop_info was not found",
							);
						}

						const folder = await window.app_get_desktop_info();

						if (!isActive || currentRequest !== requestId) return;

						if (!folder || typeof folder !== "object") {
							throw new Error(
								"Invalid folder information response",
							);
						}

						hideError();

						updateFolderTree(folder);

						const lastUpdate =
							document.getElementById("lastUpdate");

						if (lastUpdate) {
							lastUpdate.textContent =
								"Last updated: " +
								new Date().toLocaleTimeString("ja-JP");
						}
					} catch (error) {
						console.error("Folder Error:", error);

						if (isActive && currentRequest === requestId) {
							showError(
								"Failed to get folder information: " +
									error.message,
							);
						}
					} finally {
						if (currentRequest === requestId) {
							isLoading = false;
						}
					}
				}

				window.initFolderMonitor = function () {
					if (isActive) return;

					isActive = true;
					getFolderInfo();
				};

				window.destroyFolderMonitor = function () {
					isActive = false;
					requestId++;
					isLoading = false;
				};

				window.initFolderMonitor();
			})();
		</script>
	</body>
</html>
