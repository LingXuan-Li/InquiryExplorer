<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>アカウント登録 | Inquiry Explorer</title>

    <style>
      :root {
        --background: #f5f6fa;
        --surface: #ffffff;
        --text: #25283a;
        --secondary: #777b8c;
        --border: #e3e5ec;
        --primary: #6558d3;
        --primary-hover: #5145b8;
        --success: #269b69;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 20px;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
        font-family: "Noto Sans JP", "Segoe UI", sans-serif;
      }

      .container {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 32px;
        text-align: center;
      }

      .header h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }

      .header p {
        margin: 0;
        color: var(--secondary);
        font-size: 14px;
      }

      .card {
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
      }

      .provider {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .provider-icon {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        background: #f1f3f4;
        border-radius: 12px;
        font-size: 24px;
      }

      .provider-info {
        flex: 1;
      }

      .provider-info h2 {
        margin: 0 0 5px;
        font-size: 17px;
      }

      .provider-info p {
        margin: 0;
        color: var(--secondary);
        font-size: 12px;
      }

      .status {
        color: var(--success);
        font-size: 12px;
        font-weight: 600;
      }

      .description {
        margin: 22px 0;
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.8;
      }

      .register-button {
        display: flex;
        width: 100%;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .register-button:hover {
        background: var(--primary-hover);
      }

      .register-button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .message {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.6;
      }

      .message.visible {
        display: block;
      }

      .message.error {
        background: #fff0f0;
        color: #c03939;
      }

      .message.success {
        background: #edfaf3;
        color: #218653;
      }

      .permissions {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }

      .permissions h3 {
        margin: 0 0 10px;
        font-size: 13px;
      }

      .permissions ul {
        margin: 0;
        padding-left: 20px;
        color: var(--secondary);
        font-size: 12px;
        line-height: 2;
      }

      .account-section {
        margin-top: 28px;
      }

      .account-section h2 {
        margin: 0 0 14px;
        font-size: 17px;
      }

      .account-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .empty {
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--secondary);
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>アカウント登録</h1>
        <p>クラウドストレージをInquiry Explorerに接続します。</p>
      </header>

      <section class="card">
        <div class="provider">
          <div class="provider-icon">G</div>

          <div class="provider-info">
            <h2>Google Drive</h2>
            <p>Google Cloud Storage</p>
          </div>

          <span class="status">対応</span>
        </div>

        <p class="description">
          Googleアカウントを認証して、 Google Drive内のファイル情報や
          ストレージ使用量を取得します。
        </p>

        <button
          type="button"
          class="register-button"
          id="google-register"
          onclick="registerGoogle()"
        >
          <span>＋</span>
          Googleアカウントを追加
        </button>

        <div
          id="message"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

        <div class="permissions">
          <h3>アクセス権限</h3>

          <ul>
            <li>Google Driveのファイル情報の読み取り</li>
            <li>ストレージ使用量の取得</li>
            <li>ファイルの変更・削除は行いません</li>
          </ul>
        </div>
      </section>

      <section class="account-section">
        <h2>登録済みアカウント</h2>

        <div id="account-list" class="account-list">
          <div class="empty">登録済みアカウントはありません。</div>
        </div>
      </section>
    </main>

    <script>
      const button = document.getElementById("google-register");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message visible ${type}`;
      }

      async function registerGoogle() {
        button.disabled = true;
        button.textContent = "認証処理を開始しています...";

        message.className = "message";

        try {
          // Glaze側のGoメソッドと接続する予定
          await app.RegisterGoogleAccount();

          showMessage("Googleアカウントの登録が完了しました。", "success");

          await loadAccounts();
        } catch (error) {
          showMessage("認証に失敗しました: " + error, "error");
        } finally {
          button.disabled = false;
          button.innerHTML = "<span>＋</span> Googleアカウントを追加";
        }
      }

      async function loadAccounts() {
        const accounts = await app.GetAccounts();

        const list = document.getElementById("account-list");
        list.replaceChildren();

        if (!accounts || accounts.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "登録済みアカウントはありません。";
          list.appendChild(empty);
          return;
        }

        for (const account of accounts) {
          const item = document.createElement("div");
          item.className = "card";

          const name = document.createElement("strong");
          name.textContent = account.display_name || account.email;

          const email = document.createElement("p");
          email.textContent = account.email;

          item.append(name, email);
          list.appendChild(item);
        }
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadAccounts().catch((error) => {
          showMessage("アカウント一覧の取得に失敗しました: " + error, "error");
        });
      });
    </script>
  </body>
</html>
