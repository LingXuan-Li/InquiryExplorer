<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard</title>

		<style>
			.container {
				max-width: 1080px;
				margin: 0 auto;
			}

			h1 {
				font-size: 24px;
				font-weight: 700;
				line-height: 1.3;
				margin-bottom: 4px;
			}

			.subtitle {
				max-width: 64ch;
				color: var(--muted);
				font-size: 14px;
				margin-bottom: 24px;
			}

			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 24px;
				margin-bottom: 16px;
			}

			h2 {
				font-size: 16px;
				font-weight: 650;
				margin-bottom: 18px;
			}

			.error {
				display: none;
				margin-bottom: 16px;
				padding: 12px 14px;
				border: 1px solid #f3b9b9;
				border-radius: var(--radius-sm);
				background: var(--danger-bg);
				color: #a52a2a;
				font-size: 14px;
				overflow-wrap: anywhere;
			}

			.empty {
				padding: 28px;
				color: var(--muted);
				text-align: center;
			}

			.refresh-info {
				margin-top: 14px;
				color: var(--muted);
				font-size: 12px;
				text-align: right;
			}

			/* ===== Summary ===== */
			.summary {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				padding: 20px 0;
			}

			.stat {
				padding: 4px 28px;
				border-left: 1px solid var(--border);
			}

			.stat:first-child {
				border-left: none;
			}

			.card-title {
				color: var(--muted);
				font-size: 13px;
				font-weight: 500;
			}

			.value {
				margin-top: 4px;
				font-size: 26px;
				font-weight: 700;
				font-variant-numeric: tabular-nums;
				line-height: 1.3;
			}

			/* ===== Usage bars ===== */
			.usage-list {
				display: flex;
				flex-direction: column;
				gap: 14px;
			}

			.usage-row {
				display: grid;
				grid-template-columns: 130px minmax(0, 1fr) 56px;
				align-items: center;
				gap: 12px;
			}

			.usage-label {
				color: var(--muted);
				font-size: 13px;
				text-align: right;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.usage-track {
				height: 12px;
				background: var(--border);
				border-radius: 6px;
				overflow: hidden;
			}

			.usage-fill {
				width: 0%;
				height: 100%;
				background-color: var(--primary);
				border-radius: 6px;
				transition:
					width 1s ease-in-out,
					background-color 0.5s ease;
			}

			.usage-fill.warn {
				background-color: var(--warn);
			}

			.usage-fill.danger {
				background-color: var(--danger);
			}

			.usage-percent {
				font-size: 13px;
				font-weight: 600;
				font-variant-numeric: tabular-nums;
				text-align: right;
			}

			/* ===== Mount points ===== */
			.storage-item {
				padding: 16px 0;
				border-bottom: 1px solid var(--border);
			}

			.storage-item:first-child {
				padding-top: 0;
			}

			.storage-item:last-child {
				padding-bottom: 0;
				border-bottom: none;
			}

			.storage-header {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 10px;
			}

			.device {
				font-size: 15px;
				font-weight: 600;
				word-break: break-all;
			}

			.percentage {
				font-size: 15px;
				font-weight: 700;
				font-variant-numeric: tabular-nums;
			}

			.filesystem {
				margin-top: 2px;
				color: var(--subtle);
				font-size: 12px;
			}

			.progress {
				height: 8px;
				margin: 10px 0;
				background: var(--border);
				border-radius: 4px;
				overflow: hidden;
			}

			.bar {
				height: 100%;
				border-radius: 4px;
				transition: width 0.4s ease;
			}

			.storage-details {
				display: flex;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 8px;
				color: var(--muted);
				font-size: 12px;
				font-variant-numeric: tabular-nums;
			}

			@media (max-width: 700px) {
				.summary {
					grid-template-columns: 1fr;
					padding: 8px 0;
				}

				.stat {
					padding: 12px 20px;
					border-left: none;
					border-top: 1px solid var(--border);
				}

				.stat:first-child {
					border-top: none;
				}

				.card {
					padding: 20px;
				}

				.usage-row {
					grid-template-columns: 80px minmax(0, 1fr) 52px;
					gap: 8px;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.usage-fill,
				.bar {
					transition: none;
				}
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>Storage Monitor</h1>
			<p class="subtitle">
				Total, used, and free space across your drives.
			</p>

			<div id="error" class="error" role="alert"></div>

			<div class="card summary">
				<div class="stat">
					<div class="card-title">Total storage</div>
					<div class="value" id="total">--</div>
				</div>
				<div class="stat">
					<div class="card-title">Used</div>
					<div class="value" id="used">--</div>
				</div>
				<div class="stat">
					<div class="card-title">Free</div>
					<div class="value" id="free">--</div>
				</div>
			</div>

			<div class="card">
				<h2>Usage by drive</h2>
				<div id="usageList" class="usage-list"></div>
			</div>

			<div class="card">
				<h2>Mount points</h2>
				<div id="storageList">
					<div class="empty">Loading storage information...</div>
				</div>
				<div class="refresh-info">
					Last updated:
					<span id="lastUpdate">--</span>
				</div>
			</div>
		</div>

		<script>
			(() => {
				"use strict";

				let isLoading = false;
				let isActive = false;
				let requestId = 0;

				// mountpoint -> { row, fill, text, label, current, raf }
				const usageRows = new Map();

				const reduceMotion = window.matchMedia(
					"(prefers-reduced-motion: reduce)",
				);

				function formatBytes(bytes) {
					const units = ["B", "KB", "MB", "GB", "TB", "PB"];
					let value = Number(bytes) || 0;
					let index = 0;

					while (value >= 1024 && index < units.length - 1) {
						value /= 1024;
						index++;
					}

					return value.toFixed(2) + " " + units[index];
				}

				function getColor(percent) {
					if (percent >= 90) return "#d64545";
					if (percent >= 75) return "#d98a0b";
					return "#1c85ba";
				}

				function getLevel(percent) {
					if (percent >= 90) return "danger";
					if (percent >= 75) return "warn";
					return "";
				}

				function showError(message) {
					const element = document.getElementById("error");
					if (!element) return;
					element.style.display = "block";
					element.textContent = message;
				}

				function hideError() {
					const element = document.getElementById("error");
					if (!element) return;
					element.style.display = "none";
					element.textContent = "";
				}

				async function getStorageInfo() {
					if (!isActive || isLoading) return;

					isLoading = true;
					const currentRequest = ++requestId;

					try {
						if (typeof window.app_get_storage_info !== "function") {
							throw new Error(
								"Glaze API app_get_storage_info was not found",
							);
						}

						const storage = await window.app_get_storage_info();

						if (!isActive || currentRequest !== requestId) return;

						if (!Array.isArray(storage)) {
							throw new Error(
								"The Go API response is not an array",
							);
						}

						hideError();

						updateSummary(storage);
						updateUsageBars(storage);
						updateStorageList(storage);

						const lastUpdate =
							document.getElementById("lastUpdate");
						if (lastUpdate) {
							lastUpdate.textContent =
								new Date().toLocaleTimeString("ja-JP");
						}
					} catch (error) {
						console.error("Storage Error:", error);
						if (isActive && currentRequest === requestId) {
							showError(
								"Failed to get storage information: " +
									error.message,
							);
						}
					} finally {
						if (currentRequest === requestId) {
							isLoading = false;
						}
					}
				}

				function updateSummary(storage) {
					const sum = (key) =>
						storage.reduce(
							(s, item) => s + Number(item[key] || 0),
							0,
						);

					document.getElementById("total").textContent = formatBytes(
						sum("total"),
					);
					document.getElementById("used").textContent = formatBytes(
						sum("used"),
					);
					document.getElementById("free").textContent = formatBytes(
						sum("free"),
					);
				}

				// Count the number up/down while the bar animates.
				function animateText(entry, end) {
					cancelAnimationFrame(entry.raf);

					const start = entry.current;
					entry.current = end;

					if (reduceMotion.matches || start === end) {
						entry.text.textContent = end.toFixed(1) + "%";
						return;
					}

					const duration = 1000;
					const startTime = performance.now();

					const step = (now) => {
						const progress = Math.min(
							(now - startTime) / duration,
							1,
						);
						const value = start + (end - start) * progress;
						entry.text.textContent = value.toFixed(1) + "%";
						if (progress < 1) {
							entry.raf = requestAnimationFrame(step);
						}
					};

					entry.raf = requestAnimationFrame(step);
				}

				function createUsageRow(key) {
					const row = document.createElement("div");
					row.className = "usage-row";

					const label = document.createElement("div");
					label.className = "usage-label";

					const track = document.createElement("div");
					track.className = "usage-track";

					const fill = document.createElement("div");
					fill.className = "usage-fill";
					track.appendChild(fill);

					const text = document.createElement("div");
					text.className = "usage-percent";
					text.textContent = "0.0%";

					row.append(label, track, text);

					return { key, row, label, fill, text, current: 0, raf: 0 };
				}

				function updateUsageBars(storage) {
					const container = document.getElementById("usageList");
					if (!container) return;

					const seen = new Set();
					const created = [];

					storage.forEach((item, index) => {
						const key = (item.mountpoint || "") + "#" + index;
						seen.add(key);

						let entry = usageRows.get(key);

						if (!entry) {
							entry = createUsageRow(key);
							usageRows.set(key, entry);
							container.appendChild(entry.row);
							created.push(entry);
						}

						const percent = Math.max(
							0,
							Math.min(100, Number(item.used_percent) || 0),
						);

						entry.label.textContent = item.mountpoint || "";
						entry.label.title = item.mountpoint || "";
						entry.text.style.color = getColor(percent);

						entry.fill.className =
							"usage-fill " + getLevel(percent);
						entry.pendingWidth = percent;

						animateText(entry, percent);
					});

					// Remove rows that no longer exist.
					for (const [key, entry] of usageRows) {
						if (!seen.has(key)) {
							cancelAnimationFrame(entry.raf);
							entry.row.remove();
							usageRows.delete(key);
						}
					}

					// Force a reflow so newly created rows animate from 0%.
					void container.offsetWidth;

					for (const entry of usageRows.values()) {
						entry.fill.style.width = entry.pendingWidth + "%";
					}

					if (storage.length === 0) {
						const empty = document.createElement("div");
						empty.className = "empty";
						empty.textContent = "No storage information available.";
						container.replaceChildren(empty);
						usageRows.clear();
					}
				}

				function updateStorageList(storage) {
					const container = document.getElementById("storageList");
					if (!container) return;

					container.replaceChildren();

					if (storage.length === 0) {
						const empty = document.createElement("div");
						empty.className = "empty";
						empty.textContent = "No storage information available.";
						container.appendChild(empty);
						return;
					}

					storage.forEach((item) => {
						const percent = Number(item.used_percent) || 0;
						const safePercent = Math.max(0, Math.min(100, percent));
						const color = getColor(percent);

						const wrapper = document.createElement("div");
						wrapper.className = "storage-item";

						const header = document.createElement("div");
						header.className = "storage-header";

						const device = document.createElement("div");
						device.className = "device";
						device.textContent = item.mountpoint || "";

						const percentage = document.createElement("div");
						percentage.className = "percentage";
						percentage.style.color = color;
						percentage.textContent = percent.toFixed(1) + "%";

						header.append(device, percentage);

						const filesystem = document.createElement("div");
						filesystem.className = "filesystem";
						filesystem.textContent =
							(item.device || "") +
							" | " +
							(item.filesystem || "");

						const progress = document.createElement("div");
						progress.className = "progress";

						const bar = document.createElement("div");
						bar.className = "bar";
						bar.style.width = safePercent + "%";
						bar.style.backgroundColor = color;

						progress.appendChild(bar);

						const details = document.createElement("div");
						details.className = "storage-details";

						const used = document.createElement("span");
						used.textContent = "Used: " + formatBytes(item.used);

						const free = document.createElement("span");
						free.textContent = "Free: " + formatBytes(item.free);

						const total = document.createElement("span");
						total.textContent = "Total: " + formatBytes(item.total);

						details.append(used, free, total);
						wrapper.append(header, filesystem, progress, details);
						container.appendChild(wrapper);
					});
				}

				window.initStorageMonitor = function () {
					if (isActive) return;
					isActive = true;
					getStorageInfo();
				};

				window.destroyStorageMonitor = function () {
					isActive = false;
					requestId++;
					isLoading = false;
					for (const entry of usageRows.values()) {
						cancelAnimationFrame(entry.raf);
					}
					usageRows.clear();
				};

				window.initStorageMonitor();
			})();
		</script>
	</body>
</html>
