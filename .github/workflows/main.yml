name: Formatting and Testing

run-name: "Formatting and Testing · ${{ github.ref_name }}"

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: formatting-testing-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Format and Test
    runs-on: windows-latest
    timeout-minutes: 15

    # Values are passed through env instead of being pasted into scripts.
    # (A branch name is user input and must not be interpolated into shell code.)
    env:
      REF_NAME: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      REPOSITORY: ${{ github.repository }}
      LOG_SCRIPT: .github/scripts/manage_test_logs.py

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Setup Go (go.mod)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Setup PHP (EditorConfig CLI)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: iconv
          tools: composer:v2

      # Install EditorConfig CLI
      - name: Install EditorConfig CLI
        run: |
          composer global require armin/editorconfig-cli:2.2.1 --no-interaction

      # Versions are the first thing to check when a failure only
      # happens in CI.
      # Show Environment
      - name: Show Environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"

          echo ""
          echo "System:"
          uname -a

          echo ""
          echo "Go:"
          go version
          go env GOOS
          go env GOARCH
          go env GOHOSTOS
          go env GOHOSTARCH

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Commit: $(git rev-parse HEAD)"

      # Dependency Tidying
      - name: Dependency Tidying
        run: |
          go mod tidy

          if ! git diff --quiet -- go.mod go.sum; then
            echo "::notice title=go mod tidy::go.mod / go.sum were changed by 'go mod tidy' and will be committed by the bot."
            git --no-pager diff --stat -- go.mod go.sum
          fi

      # Commit Dependency Changes
      - name: Commit Dependency Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Newly created go.sum files are included as well.
          git add -A -- go.mod

          if [ -e go.sum ] || git ls-files --error-unmatch -- go.sum >/dev/null 2>&1; then
            git add -A -- go.sum
          fi

          if git diff --cached --quiet -- go.mod go.sum; then
            echo "No dependency changes to commit."
          else
            echo "Dependency changes:"
            git --no-pager diff --cached --name-status

            git commit -m "chore[bot]: Tidy Go modules"
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi

      # Formatting
      - name: Formatting
        id: formatting
        run: |
          mkdir -p "$RUNNER_TEMP"

          set +e

          {
            echo "EditorConfig Formatting"

            composer global exec ec -- --git-only --fix --no-interaction
            EDITORCONFIG_STATUS=$?

            echo ""
            echo "EditorConfig exit code: $EDITORCONFIG_STATUS"
            echo ""

            echo "Golang Formatting"

            go fmt ./...
            GOFMT_STATUS=$?

            echo ""
            echo "Go fmt exit code: $GOFMT_STATUS"

          } > "$RUNNER_TEMP/format-results.txt" 2>&1

          set -e

          if [ "$EDITORCONFIG_STATUS" -ne 0 ]; then
            FORMAT_STATUS=$EDITORCONFIG_STATUS
          elif [ "$GOFMT_STATUS" -ne 0 ]; then
            FORMAT_STATUS=$GOFMT_STATUS
          else
            FORMAT_STATUS=0
          fi

          cat "$RUNNER_TEMP/format-results.txt"

          python "$LOG_SCRIPT" \
            --source "$RUNNER_TEMP/format-results.txt" \
            --kind formatting \
            --exit-code "$FORMAT_STATUS" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --commit-sha "$(git rev-parse HEAD)" \
            --repository "$REPOSITORY"

          echo "status=$FORMAT_STATUS" >> "$GITHUB_OUTPUT"

      # Commit Formatting
      - name: Commit Formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          git add -A test-results error

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            echo "Files included in this commit:"
            git --no-pager diff --cached --name-status

            git commit -m "style[bot]: Automatic formatting"
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi

      # Testing and Logging
      - name: Testing and Logging
        id: testing
        run: |
          mkdir -p "$RUNNER_TEMP"

          # stdout: JSON events (parsed by the script)
          # stderr: download / toolchain messages (kept separately)
          set +e
          go test -json -count=1 ./... \
            > "$RUNNER_TEMP/test-results.json" \
            2> "$RUNNER_TEMP/test-stderr.txt"
          TEST_STATUS=$?
          set -e

          python "$LOG_SCRIPT" \
            --source "$RUNNER_TEMP/test-results.json" \
            --stderr "$RUNNER_TEMP/test-stderr.txt" \
            --kind testing \
            --exit-code "$TEST_STATUS" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --commit-sha "$(git rev-parse HEAD)" \
            --repository "$REPOSITORY"

          # Record the status before pushing, so that a push problem
          # cannot hide the test result.
          echo "status=$TEST_STATUS" >> "$GITHUB_OUTPUT"

          git add -A test-results error

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "test[bot]: Update test results"
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi

      # Raw outputs: handy when the saved JSON is not enough.
      - name: Upload Raw Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ci-raw-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/format-results.txt
            ${{ runner.temp }}/test-results.json
            ${{ runner.temp }}/test-stderr.txt
          if-no-files-found: ignore
          retention-days: 14

      # Final Status
      - name: Check Workflow Status
        if: always()
        env:
          FORMAT_STATUS: ${{ steps.formatting.outputs.status }}
          TEST_STATUS: ${{ steps.testing.outputs.status }}
        run: |
          failed=0

          # An empty status means the step stopped before it could report,
          # e.g. go mod tidy failed or the log script crashed.
          check() {
            local name="$1" status="$2"

            case "$status" in
              0)
                echo "✅ $name: passed"
                ;;
              "")
                echo "::error title=$name::did not complete (an earlier step failed, or the step crashed). Check the step log."
                failed=1
                ;;
              *)
                echo "::error title=$name::failed with exit code $status. See the annotations and the job summary."
                failed=1
                ;;
            esac
          }

          check "Formatting" "$FORMAT_STATUS"
          check "Testing" "$TEST_STATUS"

          {
            echo "## Result"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Formatting | ${FORMAT_STATUS:-not completed} |"
            echo "| Testing | ${TEST_STATUS:-not completed} |"
            echo ""
            echo "(\`0\` = passed)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "All checks passed."
