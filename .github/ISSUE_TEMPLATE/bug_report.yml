name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Choose based on impact and available workarounds.
      options:
        - notice - Minor visual or documentation issue
        - caution - Limited impact with a workaround
        - warning - A major feature is affected
        - danger - Broad outage or possible data corruption
        - critical - Service outage or serious data loss requiring urgent response
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected.
      placeholder: Please provide as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, commands, and other relevant details.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Add links, logs, or any other relevant information.
    validations:
      required: false
